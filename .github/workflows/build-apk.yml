name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Prepare project
        run: |
          cp -n .env.example .env || true
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          sed -i '/if (!licenseState.isActive) {/,/^        }$/d' app/src/main/java/com/example/ui/WaqfaApp.kt
          if grep -q 'LicenseActivationScreen(licenseRepository)' app/src/main/java/com/example/ui/WaqfaApp.kt; then echo "license gate still present"; exit 1; fi
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WAQFA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
